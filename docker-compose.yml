# ใช้ตอนพัฒนาบนเครื่องตัวเอง (ผู้สอนไม่ได้ใช้ไฟล์นี้ตอนประเมิน)
#   docker compose up --build                     -> http://localhost:8000
#   docker compose --profile tunnel up --build    -> เปิด quick tunnel ให้ทดสอบออนไลน์ผ่านพอร์ทัล
services:
  app:
    build: .
    ports:
      # ถ้าพอร์ต 8000 บนเครื่องถูกใช้อยู่: APP_PORT=8001 docker compose up --build  (ข้างใน container ยังเป็น 8000)
      - "${APP_PORT:-8000}:8000"
    environment:
      # Ollama ที่ติดตั้งบนเครื่องตัวเอง (Windows/macOS: host.docker.internal)
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      - app
